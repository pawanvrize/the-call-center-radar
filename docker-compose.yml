services:
  # Offline LLM fallback. Not needed for transcription or the API — start it
  # only when you're working on the reasoning layer without network:
  #   docker compose --profile offline up -d ollama
  ollama:
    image: ollama/ollama:latest
    profiles: ["offline"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Source mounted so code changes don't need an image rebuild. The image
      # still contains a full copy, so `docker compose up` works on a clone
      # with no bind mount available.
      - ./backend:/app
      - ./data:/app/data
      # faster-whisper downloads its model from HuggingFace on first use.
      # Without this, every `docker compose run --rm` re-downloads it.
      - hf_cache:/root/.cache/huggingface
    # --reload-dir restricts the file watcher to actual source code. Without
    # it, --reload's default is to watch the whole working directory — which
    # includes ./data (bind-mounted at /app/data just above). SQLite creates
    # and touches -wal/-shm sidecar files as a normal side effect of opening a
    # connection; the watcher sees those change, restarts the app, which opens
    # a connection during startup, which touches them again — a self-inflicted
    # crash loop. Hit live: every restart failed identically with "disk I/O
    # error" on the schema's own executescript(), because the file was mid-write
    # from the *previous* restart's half-finished connection when the next one
    # began. Scoping the watch to source-only makes the loop structurally
    # impossible rather than papering over one symptom of it.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-dir scripts

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Server-side only. The browser never talks to FastAPI directly — it hits
      # /api/* and /audio/* on this origin, which next.config.ts rewrites here.
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

volumes:
  ollama_models:
  hf_cache:
